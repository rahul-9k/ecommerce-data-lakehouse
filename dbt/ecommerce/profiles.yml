ecommerce:
  target: local
  outputs:
    local:
      type: postgres
      host: "{{ env_var('PGHOST', 'warehouse') }}"
      port: "{{ env_var('PGPORT', '5432') | int }}"
      user: "{{ env_var('PGUSER', 'de_user') }}"
      password: "{{ env_var('PGPASSWORD') }}"
      dbname: "{{ env_var('PGDATABASE', 'ecommerce') }}"
      schema: "{{ env_var('DBT_SCHEMA', 'analytics') }}"
      threads: 2
      connect_timeout: 10
      retries: 1
      sslmode: disable
